name: Deploy to Vercel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: |
        echo "Node version: $(node --version)"
        echo "pnpm version: $(pnpm --version)"
        echo "Starting dependency installation..."
        pnpm install --no-frozen-lockfile --verbose

    - name: Skip build for redirect-only deployment
      run: |
        echo "Skipping build step - Vercel will only deploy redirect configuration"
        echo "All traffic will be redirected to: https://www.findbrexitconsultants.co.uk/"
        echo "No build artifacts needed for redirect-only deployment"

    - name: Deploy to Vercel
      if: github.ref == 'refs/heads/master'
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "⚠️  Vercel deployment skipped: VERCEL_TOKEN secret not configured"
          echo "To enable Vercel deployment, add the following secrets to your GitHub repository:"
          echo "- VERCEL_TOKEN"
          echo "- VERCEL_ORG_ID" 
          echo "- VERCEL_PROJECT_ID"
          exit 0
        fi
        
        npm install -g vercel
        vercel --token $VERCEL_TOKEN --prod --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
